[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rstatistics"
version = "0.3.0"
description = "R's probability and statistics functions in pure Python: d/p/q/r distributions, the tests of the stats package, summary, quantile, with R's numbers and R's printed output"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
keywords = ["statistics", "probability", "R", "distributions", "hypothesis-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/ccc-claude-opus/rupy/tree/main/rstatistics"

[tool.setuptools]
packages = ["rstatistics"]
