<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rupy IDE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <span class="brand">rupy IDE</span>
  <button class="run" id="run" disabled title="執行（Ctrl/⌘ + Enter）">▶ 執行</button>
  <button id="run-all" hidden disabled title="執行所有程式格">▶▶ 全部執行</button>
  <button id="stop" disabled title="停止執行">■ 停止</button>
  <span class="status" id="status">載入編譯器中…</span>
  <button id="download" class="end" title="下載目前的檔案">下載</button>
  <span class="sync" id="sync" aria-live="polite"></span>
  <button id="account" hidden title="帳號">登入</button>
</header>
<main class="layout">
  <nav class="sidebar" aria-label="檔案">
    <div class="side-head">
      <span>檔案</span>
      <span>
        <button id="import" title="匯入程式、筆記本或資料檔" aria-label="匯入檔案">匯入</button>
        <button id="new-file" title="新增檔案" aria-label="新增檔案">＋</button>
      </span>
      <input type="file" id="import-input" accept=".py,.ipynb,.txt,.csv,.tsv,.json,.md,.svg" multiple hidden>
    </div>
    <ul id="files"></ul>
    <p class="note" id="storage-note"></p>
  </nav>
  <section class="editor-wrap">
    <div class="tab"><span id="current">—</span><button id="view-toggle" hidden title="切換圖片與原始碼"></button></div>
    <div id="editor"></div>
    <div id="notebook" hidden></div>
    <div id="preview" class="preview" hidden></div>
  </section>
  <section class="panel">
    <div class="panel-tabs" role="tablist">
      <button role="tab" class="active" data-pane="output" id="output-tab" aria-selected="true">輸出</button>
      <button role="tab" data-pane="stdin" aria-selected="false">標準輸入</button>
      <span class="spacer"></span>
      <button id="clear" title="清除輸出">清除</button>
    </div>
    <pre id="output" class="pane" aria-live="polite"></pre>
    <textarea id="stdin" class="pane" hidden spellcheck="false" placeholder="input() 從這裡一行一行讀"></textarea>
  </section>
</main>
<dialog id="login-dialog" aria-labelledby="login-title">
  <form id="login-form">
    <h2 id="login-title">登入</h2>
    <p class="muted">登入後檔案會存到伺服器，換電腦也看得到，還可以分享唯讀連結。</p>
    <label>Email <input type="email" name="email" required autocomplete="username"></label>
    <label>密碼（至少 8 個字） <input type="password" name="password" required minlength="8" autocomplete="current-password"></label>
    <p class="error" id="login-error" role="alert"></p>
    <div class="row">
      <button value="cancel" formnovalidate>取消</button>
      <span class="spacer"></span>
      <button value="register">註冊新帳號</button>
      <button class="run" value="login">登入</button>
    </div>
  </form>
</dialog>
<dialog id="account-dialog" aria-labelledby="account-email">
  <h2 id="account-email"></h2>
  <h3>我的分享連結</h3>
  <ul id="share-list" class="share-list"></ul>
  <div class="row">
    <button id="logout">登出</button>
    <span class="spacer"></span>
    <button id="account-close" class="run">關閉</button>
  </div>
</dialog>
<script type="module" src="app.mjs"></script>
</body>
</html>
