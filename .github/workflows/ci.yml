name: CI

# rupy builds ruai from ../ruai for its gymnasium, torch and ruai.plot
# packages, so both repositories are checked out side by side.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rupy
    steps:
      - uses: actions/checkout@v5
        with:
          path: rupy
      - uses: actions/checkout@v5
        with:
          repository: ccc-llm/ruai
          path: ruai
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rupy
      # the reference: CPython 3.14 with the libraries rupy's packages follow
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install numpy scikit-learn gymnasium matplotlib
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      # the WebAssembly backend runs on Node.js (WasmGC)
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: ./test.sh ci
        env:
          PY2RS_PYTHON: python
